<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a3d">
<title>ASH 2026 · Beitragsarchiv</title><link rel="stylesheet" href="../updates/styles.css">
<style>.ash-card{padding:1.1rem 1.25rem;background:white;border:1px solid var(--line);border-radius:12px}.ash-card h2{font-size:1.22rem;margin:.45rem 0}.ash-card p{line-height:1.55}.ash-card small{color:var(--muted)}.ash-card .tags{margin:.6rem 0}.ash-card .tag{white-space:normal}.filter-fields{display:flex;flex-wrap:wrap;gap:1rem;align-items:end}.filter-fields label{flex:1 1 13rem}dialog label{display:block;margin:.65rem 0}dialog input,dialog textarea{display:block;width:100%}.hero-row button{margin:.25rem 0}.results{margin-bottom:2rem}#feedback{color:#913a49}.ash-card{min-width:0;overflow-wrap:anywhere}.ash-card[data-priority="1"]{border-left:4px solid #e8bbc9}.ash-card[data-priority="2"]{border-left:4px solid #de8eaf}.ash-card[data-priority="3"]{border-left:4px solid #cc4279}.ash-card-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.ash-priority{display:flex;align-items:center;gap:9px}.ash-priority .priority-caption{margin:0}.ash-priority .priority-control button{min-width:44px;min-height:44px}.ash-priority .priority-readonly{font-size:.78rem}.filter-fields{margin-top:18px}@media(max-width:720px){.filter-fields label{flex-basis:calc(50% - 1rem);min-width:0}.hero-row>div:last-child{margin-top:18px}}@media(max-width:390px){.filter-fields label{flex-basis:100%}}
</style>
<script type="module" src="app.js?v=20261110-priority"></script></head>
<body><header><div class="wrap"><nav><a href="../">← Alle Suchtools</a><a href="../updates/">Update-Archiv →</a></nav><div class="hero-row"><div><p class="eyebrow">American Society of Hematology</p><h1>ASH 2026<span>.</span></h1><p class="intro">Ausgewählte Kongressbeiträge mit klinischer Einordnung und Quellen.</p></div><div><button id="manage" class="ghost">Prioritäten bearbeiten</button> <button id="add">Beitrag hinzufügen</button> <button id="logout" class="ghost" hidden>Admin abmelden</button></div></div></div></header>
<main class="wrap"><section id="workspace"><div class="search-box"><label for="search">Beiträge durchsuchen</label><input id="search" type="search" placeholder="Studie, Wirkstoff oder Abstractnummer …"></div>
<div class="filters filter-fields"><label>Erkrankung<select id="diseases"><option value="">Alle Erkrankungen</option></select></label><label>Methode / Medikamentenklasse<select id="methods"><option value="">Alle Methoden und Klassen</option></select></label><label>Priorität<select id="priority"><option value="">Alle Prioritäten</option><option value="any">Nur priorisierte</option><option value="3">+++</option><option value="2">++</option><option value="1">+</option><option value="0">Ohne Priorität</option></select></label><label>Sortierung<select id="sort"><option value="number">Abstractnummer</option><option value="priority">Priorität: +++ zuerst</option></select></label><button id="reset" class="text-button">Zurücksetzen</button></div>
<p id="priority-feedback" role="status" aria-live="polite"></p><p id="status" role="status">Beiträge werden geladen …</p><button id="retry" hidden>Erneut laden</button><div id="results" class="results"></div></section></main>
<dialog id="editor" aria-labelledby="editor-title"><div class="dialog-head"><h2 id="editor-title">Beitrag hinzufügen</h2><button id="close" class="icon-button" aria-label="Schließen">×</button></div>
<form id="login"><label>Admin-Passwort des Update-Archivs<input name="password" type="password" autocomplete="current-password" required></label><button>Anmelden</button></form>
<form id="form" hidden><label>Abstractnummer<input name="number" type="number" min="1" max="99999" required></label><label>Titel / Studie<input name="title" maxlength="500" required></label>
<label>Erkrankungen (mit Komma trennen)<input name="diseases" list="disease-options" required></label><datalist id="disease-options"></datalist><label>Methoden / Medikamentenklassen (mit Komma trennen)<input name="methods" list="method-options" required></label><datalist id="method-options"></datalist>
<label>Zusammenfassung und klinische Einordnung<textarea name="summary" rows="5" maxlength="12000" required></textarea></label><label>Quelle (HTTPS)<input name="source" type="url" pattern="https://.+" required></label><button>Beitrag speichern</button></form><p id="feedback" role="status"></p></dialog>
<footer class="wrap">Medizinische Suchtools <span>ASH 2026 · Beitragsarchiv</span></footer></body></html>
